components:
  schemas:
    User:
      type: object
      properties:
        _id:
          type: string
          description: The unique identifier for the user
        first_name:
          type: string
          description: The first name of the user
        last_name:
          type: string
          description: The last name of the user
        email:
          type: string
          description: the email adress od the user
        password:
          type: string
          description: the password of the user
        role:
          type: string
          description: The role of the user (e.g., user, admin)
        pets:
          type: array
          description: the pets owned by the user
        _v:
          type: integer
          description: The version of the user document in the database
      example:
        _id: 1234567890abcdef12345678
        first_name: John
        last_name: Doe
        email: johndoe@gmail.com
        password: password123
        role: user
        pets: ["67bcb79ca9340155067601fa"]
        _v: 0
    UserCreate:
      type: object
      properties:
        first_name:
          type: string
          description: The first name of the user
        last_name:
          type: string
          description: The last name of the user
        email:
          type: string
          description: the email adress od the user
        password:
          type: string
          description: the password of the user
      example:
        first_name: John
        last_name: Doe
        email: johndoe@gmail.com
        password: password123



